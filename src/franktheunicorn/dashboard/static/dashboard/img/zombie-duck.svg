<!-- Zombie duck for the Zombie Queue. Body derived from the duck icon by Manuela
     (via Noun Project) — https://openclipart.org/detail/348177/duck — CC0 1.0;
     the undead bits (green, stitches, the X eye, the bite) are franktheunicorn's. -->
<svg version="1.1" viewBox="-12 -48 104 74" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- a bite out of the tail: a mask, not a background-coloured blob, so it is a
         hole on a dark page too -->
    <mask id="bite">
      <rect x="-12" y="-48" width="104" height="74" fill="#fff" />
      <circle cx="-4.6" cy="-5.6" r="3.6" fill="#000" />
    </mask>
  </defs>
  <!-- body -->
  <path mask="url(#bite)" fill="#7cb342" stroke="#33691e" stroke-width="1.6" stroke-linejoin="round" d="
    M 0 0
    l -6.436 -4.34
    c 0 0 26.712 -7.968 43.114 -7.968
    c 11.254 0 20.963 -3.163 17.224 -9.721
    c -3.751 -6.559 -3.751 -24.824 11.241 -23.893
    c 0 0 10.322 0 11.254 9.832
    c 0 0 -0.821 3.629 12.773 6.448
    c 0 0 2.33 1.397 -1.888 3.286
    c 0 0 -20.619 -1.422 -18.731 3.739
    c 0 0 -0.466 4.475 6.436 7.147
    c 11.83 4.573 23.672 42.416 -25.657 38.787
    c 0 0 -19.333 -0.821 -34.791 -9.733
    c 0 0 -17.702 -8.066 -24.726 -9.955
    l 10.187 -3.629
    z" />
  <!-- stitched scar across the body -->
  <g stroke="#33691e" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M 22 0 L 46 -2" />
    <path d="M 27 -3.2 L 26 2.2" />
    <path d="M 33 -3.6 L 32.4 1.8" />
    <path d="M 39 -4 L 38.6 1.4" />
  </g>
  <!-- X eye -->
  <g stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round">
    <path d="M 69 -40 L 74.4 -34.6" />
    <path d="M 74.4 -40 L 69 -34.6" />
  </g>
  <!-- stitch on the head -->
  <g stroke="#33691e" stroke-width="1.2" stroke-linecap="round" fill="none">
    <path d="M 57 -41 L 63 -44" />
    <path d="M 59.2 -43.6 L 59.8 -40.6" />
    <path d="M 61.6 -44.6 L 62.2 -41.6" />
  </g>
  <!-- the beak keeps its old colour, mostly -->
  <path fill="#c9a227" d="M 76.6 -36.4 c 0.2 1.3 1.5 3 12.6 6.3 c 1.6 0.7 2.6 1.6 -1.9 3.3 c -6.8 -0.6 -13.6 -1.2 -16.8 1.1 c -0.6 -3.8 1.8 -7.6 6.1 -10.7 z" />
  <!-- a drip -->
  <path fill="#9ccc65" stroke="#33691e" stroke-width="0.8" d="M 45 14 c 0 -2.6 2.2 -4.6 2.2 -6.6 c 0 2 2.2 4 2.2 6.6 a 2.2 2.4 0 0 1 -4.4 0 z" />
</svg>
