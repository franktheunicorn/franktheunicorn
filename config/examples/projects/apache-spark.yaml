# Project config: Apache Spark
# ASF governance context — stricter review norms

owner: "apache"
repo: "spark"
review_context: "ASF project — release branches, public API, vendor-neutral"
governance: "asf"

# Paths you care about most as a committer
watched_paths:
  - "sql/catalyst/"
  - "python/pyspark/"
  - "core/src/main/"

# Paths to skip (generated code, vendored deps, etc.)
ignore_paths:
  - "docs/"
  - "resource-managers/"

tone: "direct"
test_expectations: "Ask for a test when a behavior change has no coverage, or the existing tests do not actually reach the new path."

# Per-project review voice, prepended to every agent_cli review prompt as
# authoritative guidance. This is where the project's release-process and
# convention concerns live — the things the operator actually leaves comments
# about that a generic "how to review" block can't carry. Keep it prose, not
# rules; the agent is told to treat it as authoritative.
review_guidance: |
  Apache Spark cuts release branches (branch-3.5, 4.0, 4.1, 4.2, 4.3, master)
  and a PR's target branch decides which APIs and conventions apply — this is
  the thing I leave comments on more than anything else. Call out a change
  that won't compile or behave the same on the branch it targets.
  `.withBindingPolicy(...)` / `ConfigBindingPolicy` only exists on 4.2+
  (master / branch-4.x / 4.3 / 4.2): a new SQLConf entry on one of those
  branches needs it, or `SparkConfigBindingPolicySuite` fails. It does NOT
  compile on branch-3.5/4.0/4.1, so a backport there must DROP the call and
  the `ConfigBindingPolicy` import — never suggest adding it on a pre-4.2
  branch. A new config's `.version(...)` names the target branch's next
  release (4.3.0, not 4.2.0), not master's. Name the specific upcoming release
  and where it is in its RC cycle when it matters. When you know the release
  state, say the target plainly ("Let's target 4.4, the 4.3 RC is about to
  cut so only bug fixes land there now") — that is the comment, not a generic
  "check the branch". When you do not know the plan, ask ("is this meant for
  master only, or does it need a backport?"); the author usually knows.

  Don't pre-document backports that haven't been decided. "Introduced in 4.3.0;
  also available in 3.5.10, 4.0.5, ..." in a config doc commits to backports
  nobody's approved yet; no other config in internal/config does it. Keep
  backport status in the PR description / commit, not the doc string. When a
  new config is likely to backport, prefer `createOptional` or a default that
  won't break old branches (default-off, or a sane default like 512mb that's
  safe even on a maintenance branch). A behavior-breaking default is a
  maintenance-branch hazard — security hardening that flips a default belongs
  on master, or warn-only on the branch with an opt-out, not a silent flip in
  a patch. A default flip or any user-visible behavior change in a minor
  release needs a `docs/core-migration-guide.md` entry so upgraders find it.

  Keep the diff to what was asked. Don't change unrelated code or behavior; if
  a fix is broader than the bug (e.g. `!m.foldable` rejecting `RuntimeReplaceable`
  like `nvl`/`ifnull` that `eval()` handled fine, or an unreachable `else`
  that changes DELETE's behavior), narrow it. Split unrelated commits into
  their own PR — a `[MINOR][INFRA]` drive-by doesn't belong in a SPARK-xxxxx PR.

  The deep bugs are semantic: name resolution (a column name with a dot goes
  through `FieldReference`/the parser and lands at the connector as a nested
  field), exprId collisions (a projection emitting the same name twice with
  different exprIds surviving only because `findColOrdinal` takes the first
  match), metadata columns sneaking in as data attributes via
  `LogicalPlan.resolve`'s `metadataOutput` fallback, resource ownership (who
  releases the transferred Arrow vectors — `ArrowUtils.rootAllocator` allocated
  them, the output `ColumnarBatch` holds them, nothing downstream closes them),
  parser-vs-wrap behavior. When a change shifts an invariant other code
  assumes — a leaf `DataSourceV2Relation.output` becoming a strict subset of
  the table's columns, so `PushDownUtils.pruneColumns`'s map-every-field-back-
  by-name is now wrong — find the other places that still assume the old
  invariant and flag them. Adding a field means checking `copy()`,
  serialization and snapshot paths actually carry it; a `copy()` that drops
  the new field silently reports empty.

  A cast, overflow, or null-input change has an ANSI answer and a legacy one.
  Say which. A null input should not NPE when the guard claims it fails
  closed. An interpreted path and a codegen path, or two copies of a type
  matrix, move together — timestamp and interval work names the session
  timezone, NTZ versus LTZ, and the precision boundary. A config whose
  default is another config should say where the effective value comes from.
  An `.internal()` config does not go in the user tuning table. A knob the
  doc says applies to every caller, when only one caller reads it, is the
  bug. Indexing a List inside a loop, or a max that silently ignores the
  configured memory cap, is worth a comment even when the small case looks
  fine. A classic-versus-Connect split is half a fix when the path is
  shared. A new public type next to an `@Evolving` parent carries the same
  annotation. Pushdown flags have to actually disable the pushdown. Cleanup
  registered for the happy path — an Arrow stream, a task listener, a worker
  session — has to run when a sibling stage fails too.

  If a behavior change has no test, or the existing tests miss the new path,
  ask for one. That is a good comment. A test that short-circuits before the
  new branch (`href != null` before the URI parse), asserts with an input
  that would pass anyway (`"badlink"` has no scheme so `isSafeHref` accepts
  it regardless), or passes vacuously (`lastScanSchema == null` substitutes
  an empty schema so the negative assertion is trivially true) does not
  cover the change. New public config keys belong in SQLConf.scala
  with `.withBindingPolicy` on 4.2+ and `.doc(...)`. String-typed configs need
  string validation, not a stored bool, and the Scala `checkValue` guard doesn't
  fire for Python-side `session.conf.get` reads — so validate in Python too, or
  the wrong case silently defaults; the guard can be tightened rather than only
  flagging the bypass. When a new parameter is threaded through a constructor,
  `**kwargs` on the base class, or shoving the new param after `**kwargs`, are
  the usual fixes; ping the maintainer who owns that surface when the
  convention isn't obvious.

  Defer out-of-scope concerns to a follow-up SPARK JIRA rather than blocking
  the PR — but defer with a commitment to do it ~soon, not a bare punt, and
  file the JIRA yourself when you can. When a PR sprawls across surfaces,
  suggest splitting it into separate PRs under an umbrella SPARK JIRA, and ping
  the maintainers who own each surface for a quick look. Don't paste code
  blocks; describe the direction in prose. Ask for a test when nothing
  covers the change. Don't ask for one that only re-proves a path an
  existing test already hits.

  Spark has a structured error framework: a new error path should register an
  error condition in `error-conditions.json` and throw via `SparkThrowable`,
  not a raw exception with an inline message, and the test should assert it
  with `checkError` (including the STANDARD JSON form when relevant) — not
  by matching the message text. When a problem is detectable up front, fail
  at analysis time (`CheckAnalysis`) rather than at execution time. Don't
  expose a Scala `case class` as public API — it carries a wide surface
  including the companion object; define public API in Java, following
  `SparkThrowable`. Adding a field to an existing `case class` breaks every
  pattern match on it (4-5 places in Spark, more in third-party plugins) and
  a new constructor param can't be hidden in `unapply` — weigh whether the
  field is worth it, and prefer `Option`/a builder over a positional param.
  Flag dead code the refactor introduced or left behind.

  Be precise about null and numeric edge behavior: `InternalRow.getInt`
  returns 0 on null (say so in a comment rather than letting it surprise the
  next reader), prefer an explicit null check or `pmod` over silent 0 / a
  negative partition id, and probe the empty / invalid / boundary input
  (`ObjectInputFilter.Config.createFilter("")` returns null and silently
  disables the filter; a too-narrow filter pattern like `org.apache.spark.*`
  matches the package, not subpackages, and can irreversibly delete the whole
  recovery state on failover; a truncated varint at end-of-page hangs instead
  of throwing; matching on a JDK exception message is fragile). Say what the
  change covers and what it doesn't — a deserialization gadget filter blocks
  gadgets, it doesn't make ZooKeeper contents trustworthy, so "validate
  data" / "treated as corrupt" overstates it; a reverse-proxy fix that only
  touches the non-proxy rendering path should say so.

  Don't include code-style-only churn in a substantive PR — exclude unrelated
  formatting changes; where indentation matters, follow the surrounding code
  / the repo's own scala style. Don't add a test that duplicates what an
  existing test already proves ("this just re-proves `Filter` propagates
  child partitioning"); add the interesting test that proves the new
  behavior. Verify the bug before claiming it's fixed — reproduce an OOM or
  the failure in a standalone harness and say what you ran, don't just
  reason that the new bound is safe.

  Watch documentation-link formatting: a Scaladoc `[[...]]` link only resolves
  to documented members, so a bare-name link to a companion-object member
  or a non-`val` constructor parameter renders as literal text instead of a
  link — qualify it (`[[Companion.member]]`) or drop the brackets. Broken
  or mis-targeted doc links, missing `@param`/`@return`, and Javadoc/Scaladoc
  that references a symbol that no longer exists are all worth a comment.

  Spark is a vendor-neutral project. Flag any reference to a specific vendor
  (Databricks, AWS, GCP, Azure, Cloudera, etc.) in code, configs, docs, or
  commit messages for extra consideration — a config key named after a
  vendor, a doc that says "on Databricks …", or a test that hard-codes a
  vendor endpoint shouldn't land. Point it out as a question, not a verdict
  — sometimes there's history — but make sure the author and reviewer see it.

# Areas to flag for extra consideration when a PR touches them. Each entry is
# a short descriptor; the reviewer gets them as a bulleted "flag for extra
# consideration" list, separate from the review_guidance prose. Spark has a
# couple of surfaces where a change has outsized blast radius or where the
# project has a stated direction worth checking a PR against.
review_areas_of_interest:
  # Iceberg integration in Spark — connector/v2 + the Iceberg support in
  # sql/core. Iceberg has its own release cadence and compatibility
  # surface; a change here can break cross-project integration that isn't
  # exercised by Spark's own tests. Flag for extra consideration, especially
  # around catalog/v2 table APIs, partition handling, and write paths.
  - "iceberg/** and connector/v2 Iceberg integration — flag for extra consideration (Iceberg has its own release cadence; a Spark change here can break cross-project integration Spark's own tests don't exercise)"
  # Vector type — the VECTOR type and its interactions with parquet/orc,
  # arrow, and the vectorized reader. Flag for extra consideration, especially
  # around type promotion, UDF support, and read/write round-tripping.
  - "vector type — VECTOR type changes (parquet/orc/arrow round-trip, type promotion, UDF support) flag for extra consideration"

# Threat model / trust boundaries, fed into security-report triage. This is
# what lets triage tell "we run arbitrary code by design" reports apart from
# real findings, instead of flagging (or dismissing) everything the same way.
#
# The same text also feeds the security-focused agent PR review: an
# agent_cli_reviewers entry in operator.yaml with `review_focus: security`
# gets this model prepended to its prompt on every PR diff, so it flags real
# boundary crossings (crafted data files, web-UI XSS) instead of the
# documented "submitted code is trusted" behavior. To turn that pass on:
#   agent_cli_reviewers:
#     - name: "cursor-agent-security"
#       cli_path: "cursor-agent"
#       review_focus: "security"
#       trust_args: ["--trust"]
#       extra_args: ["--mode", "ask"]
# There is no project-level switch — the operator entry is the consent, and
# this file's security_model is what makes its findings accurate for Spark.
#
# The dividing line is the INPUT CHANNEL the exploit travels through:
#   - Trusted (expected behavior, not a finding): anything reachable only by a
#     party who can already submit code to the cluster. Submitted jobs, SQL,
#     UDFs, and *loaded ML models/pipelines* all run arbitrary code by design;
#     a malicious model that reads files or runs code, or a Spark Connect
#     ExternalCommandRunner that executes a command, is the documented
#     contract. Exposing an unauthenticated endpoint (Connect gRPC, the REST
#     submission server) is a deployment/configuration responsibility, not a
#     code vulnerability.
#   - Untrusted (real finding): a normally-untrusted artifact triggering code
#     execution or file access. A *data file* read by the engine (Parquet/ORC/
#     Avro, including its footer/key-value metadata and summary files like
#     _common_metadata) must never load classes, deserialize pickles, or run
#     code — reading data is not a trust boundary you get to cross. The Web UIs
#     (History Server, Worker, Driver, Master on 4040/8080/18080) are an attack
#     surface: reflected/stored XSS and injection there are real, though often
#     lower severity because a hardened deploy authenticates them.
#
# Net: "malicious model/pipeline runs code" or "authenticated job runs a
# command" => expected. "malicious Parquet/data file runs code" or "XSS in a
# log/UI page" => triage as a real finding and assess severity on its merits.
#
# You don't have to inline this. Triage resolves the security model in order:
#   1. the inline `security_model` prose below, else
#   2. `security_model_file:` — an explicit repo-relative path, else
#   3. auto-discovery of a conventional threat-model file committed to the repo
#      (.frank/security-model.md, SECURITY_MODEL.md, THREAT_MODEL.md,
#       docs/security-model.md, docs/threat-model.md).
# So you can instead drop the text below into `.frank/security-model.md` in the
# Spark checkout and delete this block — frank will load it automatically.
# (This is why it's inlined here for Spark: upstream keeps its security posture
# in docs/security.md — which frank DOES auto-read as supporting context — plus
# a SECURITY.md reporting-policy pointer, but there is no standalone
# machine-readable trust-boundary file to auto-load. SECURITY.md is
# deliberately NOT used as the model: by convention it's a reporting policy.)
# security_model_file: ".frank/security-model.md"

# The PMC this project maps to at the ASF CVE process service
# (cveprocess.apache.org) — the `pmc` form field when the dashboard allocates
# a CVE id for a report, and the scope the pasted Bearer tokens are issued
# for. Tokens are pasted per-session on the security page (they live for
# hours; they are never read from env vars or this file). Empty falls back to
# the repo name for apache/* projects (apache/spark → "spark"), logged when
# used — set it when the PMC and the repo name differ.
cve_process_pmc: "spark"

security_model: |
  Spark treats anyone who can submit code, SQL, UDFs, jobs, or ML
  models/pipelines to a cluster as fully trusted: those inputs run arbitrary
  code by design, so reports amounting to "a crafted model / submitted command
  / Spark Connect runner executes code" describe documented behavior, not a
  vulnerability. Securing and authenticating cluster endpoints (Spark Connect
  gRPC, the REST submission server, the Web UIs) is the operator's deployment
  responsibility rather than a code-level flaw.

  However, reading DATA is not a trust boundary. A crafted data file (Parquet,
  ORC, Avro, etc.) — including its schema footer, key-value metadata, and
  summary files such as _common_metadata — must never cause class loading,
  pickle/Java deserialization, reflection, or code execution. Treat "loading a
  malicious data file runs code / reads arbitrary files" as a genuine finding.
  Likewise the Spark Web UIs (History Server, Worker, Driver, Master) are a
  real attack surface: reflected or stored XSS and injection in log/UI pages
  are genuine findings, usually low-to-medium severity.

# LLM sub-checks — each runs a focused prompt and feeds findings through
# the standard anti-pattern pipeline.  Add or remove as needed.
llm_checks:
  - coverage          # flags new code paths not covered by new tests
  - security          # scans diff for security anti-patterns
  - security-context  # broadens security scan with CVE-file context
  - pr-description    # nudges incomplete or vague PR descriptions
  - issue-link        # flags PRs missing a SPARK-xxxxx reference
  - api-misuse        # deprecated/complex API calls (needs network; see below)

# api-misuse look-up config.  Only active when "api-misuse" is in llm_checks.
# Issues requests to Maven Central (and optionally hosted Javadoc).
api_misuse:
  enabled: true
  registries: ["maven"]
  cache_ttl_days: 7
  max_calls_per_pr: 30
  scrape_hosted_docs: true

# Copy-pasta detection — flag blocks of code copied verbatim from other files
# in the repo (or identical to existing code outside the diff).
copypasta_enabled: true
copypasta_min_lines: 5
copypasta_scan_extensions: [".py", ".scala", ".java", ".sql"]
copypasta_llm_enabled: true
# Noise control. Test scaffolding is duplicated on purpose — main guards,
# license headers, the same harness call in every test file — and flagging it
# is noise you'd only reject one draft at a time. A block already present in
# more than this many other files in the repo is treated as an established
# idiom and stays quiet (0 reports every match).
copypasta_max_repo_occurrences: 2
# Extra regexes (matched against whitespace-collapsed lines) that count as
# boilerplate on top of the built-in set. Comments, imports, main guards and
# bare block punctuation are already covered — don't re-list those (an entry
# like "^from pyspark\\.testing import" is dead weight, the import rule has it).
# List the project-specific scaffolding instead:
copypasta_ignore_patterns:
  - "^sc\\.stop\\(\\)$"
  - "^spark\\.stop\\(\\)$"
  - "^self\\.spark\\.stop\\(\\)$"

# Poll cost control. A PR whose upstream updated_at hasn't moved — and whose
# title/labels/reviewers/assignees/draft state are unchanged — is skipped
# instead of re-fetching its files, detail, and comments. Time-dependent
# signals (staleness, waiting-on-author) still get re-scored this often.
# Every refreshed PR costs at least three API calls, so this repo's ~450 open
# PRs came to over a thousand calls per cycle against a 5000/hour budget:
# the quota ran dry and ingestion silently degraded to HTML scrapes.
# 0 disables the skip.
poll_refresh_hours: 24

# People whose PRs you typically review or collaborate with
frequent_contributors:
  - "cloud-fan"
  - "dongjoon-hyun"
  - "HyukjinKwon"
  - "viirya"

enabled: true

# --- Alert mode (enabled by default for this project) ---
# Frank raises an alert — and emails you, when operator.yaml `alerts:` has a
# recipient configured — when someone raises a PR matching something you're
# working on, or when a security report is sitting in the queue or in triage.
# "Working on" always includes files touched by your own open Spark PRs;
# working_paths/working_keywords declare in-flight work that isn't visible
# on GitHub yet. Requires the master switch: `alerts.enabled: true` in
# operator.yaml.
alerts:
  enabled: true
  working_overlap: true     # PRs overlapping your in-flight work
  security_reports: true    # security reports filed against this project
  working_paths:
    - "core/src/main/scala/org/apache/spark/storage/"  # e.g. decommissioning work
    - "python/pyspark/sql/connect/"
  working_keywords:
    - "decommission"
    - "spark connect"

# Full-file + first-party-import context injected into review prompts.
# Bumped budgets for a large monorepo — reduces "can't see the surrounding
# code" false positives on catalyst/optimizer changes.
context:
  include_full_file: true
  include_first_party_imports: true
  total_token_budget: 8000
  per_file_token_cap: 3000
  import_depth: 1
  package_roots: ["sql", "core", "python"]

# Differential test runner (see docs/test-runner.md). Spark publishes a
# CI-grade test image upstream, so we use it as-is rather than rebuilding.
tests:
  enabled: true
  container_image: ghcr.io/apache/spark-test:latest
  resource_tier: heavy
  test_command: "python -m pytest {tests} --tb=short -q"

# --- v1.5 features ---

# JIRA integration — fetch ticket context for PRs referencing SPARK-xxxxx
jira:
  enabled: true
  server: "https://issues.apache.org/jira"
  project_prefix: "SPARK"

# Community context sources
community_sources:
  - type: mailing-list
    name: "Spark dev@"
    archive_url: "https://lists.apache.org/list.html?dev@spark.apache.org"
    timeout_seconds: 30
    cache_ttl_days: 7
    niceness_delay_seconds: 2.0
  # - type: discourse
  #   name: "Spark Forum"
  #   base_url: "https://forum.spark.example.com"
  # - type: discord
  #   name: "Spark Discord"
  #   guild_id: "YOUR_GUILD_ID"
  #   bot_token_env: "DISCORD_BOT_TOKEN"

# Cross-project downstream detection
downstream:
  - project: "spark-testing-base"
    repo: "holdenk/spark-testing-base"
    tracked_apis_file: "data/cache/downstream/spark-testing-base-imports.json"

# Posting mode — draft-only (default) or confidence-gated auto-posting
posting:
  mode: draft-only  # Change to "confidence-gated" to enable auto-posting
  confidence_threshold: 0.85
  bot_token_env: "GITHUB_TOKEN_BOT"

# Rejection predictor (v1.75) — opt-in. When enabled, findings are scored by
# a per-project sklearn model (auto-trained once enough operator actions
# accumulate) and high-P(rejection) findings are auto-suppressed.
# rejection_predictor_enabled: true

# --- v2 features ---

# Shepherding (v2) — opt-in. Drafts replies to reviewers on YOUR PRs and
# creates rebase/staleness alerts for them.
# shepherding_enabled: true

# Fine-tuned model — deployed after running `python manage.py fine_tune`
# fine_tuned_model:
#   enabled: true
#   provider: "ollama"
#   model: "franktheunicorn-spark-v1"
#   endpoint: "http://localhost:11434"
#   slot: "first-pass"       # first-pass | fast | primary | reasoning
#   refine_with: "primary"   # which backend refines the first-pass output

# Merge queue — track and merge PRs meeting configurable criteria
merge_queue:
  enabled: true
  required_approvals: 2
  require_ci_pass: true
  require_no_conflicts: true
  merge_script: "dev/merge_spark_pr.py"  # custom merge script
  auto_merge: false
  merge_method: "merge"    # merge | squash | rebase
